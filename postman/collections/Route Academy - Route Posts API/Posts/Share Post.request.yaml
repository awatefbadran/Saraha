$kind: http-request
url: "{{baseUrl}}/posts/{{postId}}/share"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "body": "Sharing this great post @mentor_user"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
order: 10000
