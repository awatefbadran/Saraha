$kind: http-request
url: "{{baseUrl}}/posts/{{postId}}/comments/{{commentId}}"
method: PUT
body:
  type: formdata
  content:
    - type: text
      key: content
      value: Updated comment text
    - type: file
      key: image
      src: ""
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
order: 5000
