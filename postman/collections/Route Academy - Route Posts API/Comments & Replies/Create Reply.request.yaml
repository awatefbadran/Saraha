$kind: http-request
url: "{{baseUrl}}/posts/{{postId}}/comments/{{commentId}}/replies"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: content
      value: Reply with mention @mentor_user
    - type: file
      key: image
      src: ""
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
order: 4000
