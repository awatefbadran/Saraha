$kind: http-request
description: Change password and return refreshed auth token.
url: "{{baseUrl}}/users/change-password"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "password": "Aa@123456",
      "newPassword": "Bb@123456"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
order: 3000
