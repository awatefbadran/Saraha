  ## About Route Academy

  Route Academy is Egypt's leading Information Technology training center, established in 2012. We specialize in delivering high-quality training in programming, web development, and app development.

  This collection includes all API endpoints for Route Posts with ready-to-run examples.

  ## Standard Response Shape

  All endpoints return a unified format:

  ``` json
  {
    "success": true,
    "message": "...",
    "data": {},
    "meta": {}
  }

   ```

  Error format:

  ``` json
  {
    "success": false,
    "message": "...",
    "errors": "..."
  }

   ```
